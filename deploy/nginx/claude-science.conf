# TLS reverse proxy for Claude Science (nginx).
#
# Bring your own certificates (certbot/acme.sh). Start the container with:
#   CLAUDE_SCIENCE_ALLOW_ORIGINS=https://science.example.com
# so the daemon's CSRF gate accepts WebSocket upgrades from this Origin.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name science.example.com;

    ssl_certificate     /etc/letsencrypt/live/science.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/science.example.com/privkey.pem;

    # Analyses upload/download real datasets - don't cap them at nginx defaults.
    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSockets (the UI is a live session)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-running analysis streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# The sandbox port serves Claude-generated HTML previews. It is intentionally
# a *different* origin so a previewed page can never read your session.
# Publish it on a separate hostname, never a sub-path of the UI host.
server {
    listen 443 ssl;
    http2 on;
    server_name science-preview.example.com;

    ssl_certificate     /etc/letsencrypt/live/science.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/science.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
