# Multiple isolated Claude Science instances on one host - e.g. one per lab
# member. Claude Science is a single-user daemon (one login, one data dir),
# so you scale it horizontally: one container + one volume + one port per user.
#
#   docker compose -f deploy/multi-instance/compose.yaml up -d
#   Alice opens http://localhost:8000, Bob opens http://localhost:8010
#   (sign-in is automatic; each connects their own Claude account once)
#
# Each user gets their own shared folder (./folders/<user> next to this file,
# or set ALICE_FOLDER / BOB_FOLDER); attach more with
#   CONTAINER=claude-science-alice scripts/folders.sh add <folder>
#
# Add a user: copy a service block, bump the port, done. Each instance is
# fully isolated: own login session, own projects, own analysis environments.

name: claude-science-multi

x-instance: &instance
  image: ${CLAUDE_SCIENCE_IMAGE:-claude-science:local}
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  security_opt:
    # Required for the daemon's bubblewrap sandbox - see docs/security.md
    - seccomp=unconfined
    - apparmor=unconfined
    - systempaths=unconfined
  # Per-user fairness on a shared box - tune to your hardware:
  # deploy:
  #   resources:
  #     limits:
  #       cpus: "2"
  #       memory: 4g

services:
  alice:
    <<: *instance
    container_name: claude-science-alice
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - alice-data:/data
      - ${ALICE_FOLDER:-./folders/alice}:/home/claude/ClaudeScience

  bob:
    <<: *instance
    container_name: claude-science-bob
    environment:
      # Previews load from localhost:<sandbox port>, so it must be the same
      # number on both sides of the publish.
      CLAUDE_SCIENCE_SANDBOX_PORT: 8011
    ports:
      - "127.0.0.1:8010:8000"
      - "127.0.0.1:8011:8011"
    volumes:
      - bob-data:/data
      - ${BOB_FOLDER:-./folders/bob}:/home/claude/ClaudeScience

volumes:
  alice-data:
    name: claude-science-data-alice
  bob-data:
    name: claude-science-data-bob
